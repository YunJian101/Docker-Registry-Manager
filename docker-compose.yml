services:
  web-ui:
    build: .  # 从当前目录的Dockerfile构建
    container_name: registry_webui
    ports:
      - "5001:5001"  # Web UI端口
    environment:
      - REGISTRY_BASE_URL=http://192.168.11.3:5000  # 连接外部registry服务
      - REGISTRY_HOST=test.ue5.fun:8888  # Registry外部访问地址
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=192.168.11.3
      - REDIS_PORT=6379
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - E:\AI-Project\Regsitry2\data\registry:/var/lib/registry:ro  # 只读模式，确保安全
      - /var/run/docker.sock:/var/run/docker.sock  # 挂载Docker socket
      - ./:/app:rw  # 配置目录映射
    restart: unless-stopped