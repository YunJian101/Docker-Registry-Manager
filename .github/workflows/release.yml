name: Docker Image Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # 精确匹配 v1.0.0 格式

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 代码检出
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # 解析版本号
      - name: Parse Version Tags
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "FULL_VERSION=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "MAJOR_VERSION=$(echo $TAG_NAME | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "MINOR_VERSION=$(echo $TAG_NAME | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          echo "PATCH_VERSION=$(echo $TAG_NAME | cut -d. -f3)" >> $GITHUB_OUTPUT
          
      # 设置Docker元数据
      - name: Set up Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/docker-registry-manager
          tags: |
            type=raw,value=${{ steps.version.outputs.FULL_VERSION }}
            type=raw,value=${{ steps.version.outputs.MINOR_VERSION }}
            type=raw,value=latest
            
      # 设置QEMU和Docker Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # 登录Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # 构建并推送镜像
      - name: Build and Push Docker Images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
      # 从CHANGELOG提取发布日志
      - name: Extract Release Notes
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.FULL_VERSION }}
          echo "Extracting release notes for $VERSION"
          
          # 查找版本对应的CHANGELOG条目
          START_LINE=$(grep -n "^## \[$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)
          
          if [ ! -z "$START_LINE" ]; then
            # 找到下一个版本的开始行
            END_LINE=$(awk "NR > $START_LINE && /^## \[/ {print NR; exit}" CHANGELOG.md)
            
            if [ ! -z "$END_LINE" ]; then
              sed -n "${START_LINE},$(($END_LINE-1))p" CHANGELOG.md > release_notes.md
            else
              # 如果是最后一个版本，提取到文件末尾
              sed -n "${START_LINE},\$p" CHANGELOG.md > release_notes.md
            fi
            
            # 移除版本标题行
            tail -n +2 release_notes.md > temp_notes.md
            mv temp_notes.md release_notes.md
          else
            echo "## What's Changed" > release_notes.md
            echo "" >> release_notes.md
            echo "No detailed changelog available for version $VERSION." >> release_notes.md
            echo "Please check the repository for more information." >> release_notes.md
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      # 创建GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Docker Registry Manager ${{ steps.version.outputs.FULL_VERSION }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          
      # 发布完成通知
      - name: Release Success Notification
        run: |
          echo "✅ Successfully released version ${{ steps.version.outputs.FULL_VERSION }}"
          echo "📦 Created Docker images:"
          echo "  - ${{ secrets.DOCKER_USERNAME }}/docker-registry-manager:${{ steps.version.outputs.FULL_VERSION }}"
          echo "  - ${{ secrets.DOCKER_USERNAME }}/docker-registry-manager:${{ steps.version.outputs.MINOR_VERSION }}"
          echo "  - ${{ secrets.DOCKER_USERNAME }}/docker-registry-manager:latest"