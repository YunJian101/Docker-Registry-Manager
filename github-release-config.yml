# Docker Registry Manager - GitHub自动化发布配置
# 本配置文件定义了完整的CI/CD发布流程

name: Docker Image Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # 正式版本标签匹配 (如 v1.0.0, v2.1.5)

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      # 1. 代码检出
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于CHANGELOG解析

      # 2. 解析版本号信息
      - name: Parse Version Information
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Full version tag: $TAG_NAME"
          
          # 提取版本组件
          MAJOR=$(echo $TAG_NAME | cut -d. -f1 | sed 's/v//')
          MINOR=$(echo $TAG_NAME | cut -d. -f2)
          PATCH=$(echo $TAG_NAME | cut -d. -f3)
          
          echo "MAJOR_VERSION=v$MAJOR" >> $GITHUB_OUTPUT
          echo "MINOR_VERSION=v$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          
          echo "✅ Version parsing completed:"
          echo "   Major: v$MAJOR"
          echo "   Minor: v$MAJOR.$MINOR" 
          echo "   Full:  $TAG_NAME"

      # 3. 设置Docker构建环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      # 4. 登录GitHub Container Registry (零配置)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 构建并推送Docker镜像到GitHub Container Registry
      - name: Build and Push Multi-tag Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docker-registry-manager:${{ steps.version.outputs.FULL_VERSION }}
            ghcr.io/${{ github.repository_owner }}/docker-registry-manager:${{ steps.version.outputs.MINOR_VERSION }}
            ghcr.io/${{ github.repository_owner }}/docker-registry-manager:latest
          labels: |
            org.opencontainers.image.title=Docker Registry Manager
            org.opencontainers.image.description=Web UI for managing Docker Registry
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION_NUMBER }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # 6. 从CHANGELOG提取发布日志
      - name: Extract Release Notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.FULL_VERSION }}
          echo "🔍 Extracting release notes for $VERSION"
          
          # 查找版本对应的CHANGELOG条目
          START_LINE=$(grep -n "^## \[$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)
          
          if [ ! -z "$START_LINE" ]; then
            echo "📄 Found CHANGELOG entry at line $START_LINE"
            
            # 找到下一个版本的开始行
            END_LINE=$(awk "NR > $START_LINE && /^## \[/ {print NR; exit}" CHANGELOG.md)
            
            if [ ! -z "$END_LINE" ]; then
              echo "📋 Extracting lines ${START_LINE}-$(($END_LINE-1))"
              sed -n "${START_LINE},$(($END_LINE-1))p" CHANGELOG.md > release_notes.md
            else
              echo "📋 Extracting from line ${START_LINE} to end of file"
              sed -n "${START_LINE},\$p" CHANGELOG.md > release_notes.md
            fi
            
            # 移除版本标题行，只保留内容
            tail -n +2 release_notes.md > temp_notes.md
            mv temp_notes.md release_notes.md
            
          else
            echo "⚠️  No CHANGELOG entry found for $VERSION"
            echo "## What's Changed" > release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}" >> release_notes.md
          fi
          
          # 输出release notes到GitHub Actions
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Release notes extracted:"
          cat release_notes.md

      # 7. 创建GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ steps.version.outputs.FULL_VERSION }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false

      # 8. 发布完成通知
      - name: Release Success Summary
        run: |
          echo "🎉 Release Process Completed Successfully!"
          echo ""
          echo "📦 Published Docker Images to GitHub Container Registry:"
          echo "   1. ghcr.io/${{ github.repository_owner }}/docker-registry-manager:${{ steps.version.outputs.FULL_VERSION }}"
          echo "   2. ghcr.io/${{ github.repository_owner }}/docker-registry-manager:${{ steps.version.outputs.MINOR_VERSION }}"  
          echo "   3. ghcr.io/${{ github.repository_owner }}/docker-registry-manager:latest"
          echo ""
          echo "📝 GitHub Release: ${{ steps.version.outputs.FULL_VERSION }}"
          echo "🔗 Repository: https://github.com/${{ github.repository }}"
          echo "🐳 Container Registry: https://github.com/users/${{ github.repository_owner }}/packages"

# 非正式标签监控工作流
---
name: Tag Monitor (Non-release tags)

on:
  push:
    tags:
      - '**'                    # 匹配所有标签
      - '!v[0-9]+.[0-9]+.[0-9]+' # 排除正式版本标签

jobs:
  monitor:
    name: Tag Monitoring
    runs-on: ubuntu-latest
    
    steps:
      - name: Non-release Tag Detected
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "🏷️  Non-release tag detected: $TAG_NAME"
          echo "This tag does not follow the formal release pattern (vX.Y.Z)"
          echo "No Docker image build or GitHub Release will be created"
          echo ""
          echo "💡 Formal release tags should use format: v1.0.0, v2.1.5, etc."
          echo "💡 This tag is suitable for: beta releases, release candidates, or development markers"

# 配置说明和使用指南
---
# 📋 GitHub自动化发布配置说明

## 🎯 功能概述
本配置实现智能的Docker镜像自动发布流程：
- 正式版本标签(v1.0.0) → 构建镜像 + 创建Release
- 非正式标签(beta等) → 仅创建标签，无构建

## 📦 镜像标签策略
当发布 v1.0.1 版本时，自动创建三个Docker镜像标签：

1. **具体版本**: `ghcr.io/username/docker-registry-manager:v1.0.1`
2. **大版本**: `ghcr.io/username/docker-registry-manager:v1.0`  
3. **最新版本**: `ghcr.io/username/docker-registry-manager:latest`

## 🚀 使用方法（零配置！）

### 发布正式版本
```bash
# 创建并推送正式版本标签 - 完全自动，无需任何配置
git tag v1.0.1
git push origin v1.0.1
```

### 发布预发布版本
```bash
# 创建非正式标签（不会触发构建）
git tag beta-v1.0.1
git push origin beta-v1.0.1
```

## 📝 CHANGELOG格式要求
确保CHANGELOG.md包含标准格式的版本条目：
```markdown
## [v1.0.1] - 2024-01-15
### Added
- 新功能描述

### Fixed  
- 修复的问题描述
```

## 🎉 预期输出
成功发布后将获得：
- 三个Docker镜像标签推送到GitHub Container Registry
- 自动生成的GitHub Release（标题为纯版本号）
- 从CHANGELOG提取的更新日志
- 完整的发布摘要信息

## 🔧 注意事项
- **零配置**: 不需要任何密钥配置，完全自动化
- **公开安全**: 使用GitHub内置的token机制，无需暴露敏感信息
- **多架构支持**: 自动构建amd64和arm64架构镜像